name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Querator shuttle 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Check and Initialize Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: ./android/gradlew --project-dir android assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Querator shuttle 1/android/app/build/outputs/apk/debug/app-debug.apk
