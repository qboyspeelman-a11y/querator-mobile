name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Assets
        working-directory: ./Querator shuttle 1
        run: |
          npm install
          npm run build

      - name: Recreate Capacitor Android Platform
        working-directory: ./Querator shuttle 1
        run: |
          rm -rf android
          npx cap add android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd "./Querator shuttle 1/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Querator shuttle 1/android/app/build/outputs/apk/debug/app-debug.apk
